version: '3.8'

services:
  agenthq:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - agenthq_data:/app
    restart: unless-stopped

volumes:
  agenthq_data:
